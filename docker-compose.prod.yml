# Cerberus Production Multi-Service Stack (5 services, 1 image)
# Uses the unified GHCR image: ghcr.io/metabbe3/cerberus:latest
#
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.prod.yml up -d
#
# All gates publish exclusively to loopback (127.0.0.1) for defense-in-depth.
# Engine is on the internal network only and reachable by gates at http://engine:8089.

name: cerberus-prod

services:
  # 1. Policy Engine — central brain, decide API, hot reload, audit trail
  engine:
    image: ghcr.io/metabbe3/cerberus:latest
    restart: unless-stopped
    command: /usr/local/bin/cerberus
    environment:
      CERBERUS_ADDR: ":8089"
      CERBERUS_POLICY_DIR: /policies
      CERBERUS_DATA_FILE: /data/prod.json
      CERBERUS_AUDIT_DB: /audit/cerberus.db
      CERBERUS_PG_DSN: ${CERBERUS_PG_DSN:-}
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:-}
    volumes:
      - ./policies:/policies:ro
      - ./data:/data:ro
      - engineaudit:/audit
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8089/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # 2. LLM Tap — in-path HTTP proxy intercepting & auditing LLM agent traffic
  tap:
    image: ghcr.io/metabbe3/cerberus:latest
    restart: unless-stopped
    command: cerberus-tap -listen 0.0.0.0:8090 -upstream https://api.z.ai/api/anthropic -engine-url http://engine:8089 -data-dir /data -retention-days 14 -strict
    environment:
      TAP_ADMIN_TOKEN: ${TAP_ADMIN_TOKEN:-}
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:-}
    volumes:
      - tapdata:/data
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - edge
      - internal
    depends_on:
      engine:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # 3. Docker Socket-Proxy — shield protecting the docker daemon socket
  proxy:
    image: ghcr.io/metabbe3/cerberus:latest
    restart: unless-stopped
    command: cerberus-proxy -listen 0.0.0.0:2377 -docker-host unix:///var/run/docker.sock -policy-dir /gate-policies -data-file /gate-data/data.json -audit-db /audit/proxy-audit.db -default-key k-default-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./policies:/gate-policies:ro
      - ./data:/gate-data:ro
      - proxyaudit:/audit
    ports:
      - "127.0.0.1:2377:2377"
    networks:
      - edge
    depends_on:
      engine:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # 4. Egress HTTP Proxy — outbound egress shield for external agent calls
  egress:
    image: ghcr.io/metabbe3/cerberus:latest
    restart: unless-stopped
    command: cerberus-proxy -listen 127.0.0.1:8087 -egress-addr 0.0.0.0:8088 -policy-dir /gate-policies -data-file /gate-data/data.json -audit-db /audit/egress-audit.db -default-key k-default-agent
    volumes:
      - ./policies:/gate-policies:ro
      - ./data:/gate-data:ro
      - egressaudit:/audit
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - edge
    depends_on:
      engine:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # 5. SSH Bastion Gate — decide-only audit gate inspecting commands via engine
  ssh:
    image: ghcr.io/metabbe3/cerberus:latest
    restart: unless-stopped
    command: cerberus-ssh -listen 0.0.0.0:2222 -engine-url http://engine:8089
    environment:
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:-}
    volumes:
      - sshdata:/data
    ports:
      - "127.0.0.1:2222:2222"
    networks:
      - edge
      - internal
    depends_on:
      engine:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  edge: {}
  internal: {}

volumes:
  engineaudit: {}
  tapdata: {}
  proxyaudit: {}
  egressaudit: {}
  sshdata: {}
