name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.2

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - run: make lint
      - run: make test
      - name: Run test suite with race detector
        run: CERBERUS_SKIP_POLICY_SUITE=1 go test -race -count=1 -timeout=25m ./...
      - name: Fuzz smoke test
        run: go test -v ./internal/engine -fuzz=FuzzDecide -fuzztime=30s
      - run: make opa-check
      - run: make opa-test

  owl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owl/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  docker:
    name: Build & Push GHCR Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unified Cerberus image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/metabbe3/cerberus:latest
            ghcr.io/metabbe3/cerberus:${{ github.sha }}
