name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.2

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - run: make lint
      - run: make test
      - name: Run test suite with race detector
        run: go test -race -count=1 -timeout=25m ./...
      - name: Fuzz smoke test
        run: go test -v ./internal/engine -fuzz=FuzzDecide -fuzztime=30s
      - run: make opa-check
      - run: make opa-test

  owl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: owl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: owl/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # Playwright smoke (3 flows) runs locally against a real engine + dev
      # server; CI keeps the cheap static checks until it hurts to skip them.
