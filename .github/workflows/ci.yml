name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 1.22.2

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

      - run: make lint
      - run: make test
      - run: make opa-check
      - run: make opa-test
