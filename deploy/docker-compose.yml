# Cerberus engine standalone. From the repo root:
#   CERBERUS_ADMIN_TOKEN=smoke docker compose -f deploy/docker-compose.yml up
# The audit DB lives in the named volume, so decisions survive restarts.
# ../data is bind-mounted so dashboard edits (PUT /v1/admin/data) persist on the
# host; the container runs as uid 65532, so make it writable first:
#   sudo chown -R 65532:65532 data/   (or: chmod -R a+rwX data/ for local dev)
services:
  cerberus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8089:8089"
    environment:
      CERBERUS_ADDR: ":8089"
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:?set CERBERUS_ADMIN_TOKEN}
      CERBERUS_LOG_LEVEL: info
    volumes:
      - ../data:/data
      - cerberus-db:/var/lib/cerberus

  # Owl dashboard — optional at runtime (engine works without it):
  #   CERBERUS_ADMIN_TOKEN=smoke OWL_PASSWORD=… OWL_SESSION_SECRET=$(openssl rand -hex 32) \
  #     docker compose -f deploy/docker-compose.yml --profile owl up
  owl:
    profiles: [owl]
    build:
      context: ../owl
      dockerfile: Dockerfile
    ports:
      # Loopback by default. Owl's login is one shared admin password over a
      # plain-http port — terminate TLS in front of it before publishing.
      - "127.0.0.1:3000:3000"
    environment:
      CERBERUS_URL: http://cerberus:8089
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:?set CERBERUS_ADMIN_TOKEN}
      # Not `:?`-required: compose interpolates every service even when the
      # owl profile is off. Unset = nobody can sign in (Owl fails closed).
      OWL_PASSWORD: ${OWL_PASSWORD:-}
      OWL_SESSION_SECRET: ${OWL_SESSION_SECRET:-}
      # Session cookie is Secure in production; this lets the plain-http
      # loopback port work. Drop it once TLS terminates in front of Owl.
      OWL_INSECURE_COOKIE: "1"
      # Read-only Rego sources for the /policy viewer; engine and Owl share
      # the policies files in compose (deploy decision in ROADMAP Phase 2).
      OWL_POLICY_DIR: /policies
    volumes:
      - ../policies:/policies:ro
    depends_on:
      - cerberus

volumes:
  cerberus-db:
