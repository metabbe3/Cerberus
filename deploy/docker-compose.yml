# Cerberus engine standalone. From the repo root:
#   CERBERUS_ADMIN_TOKEN=smoke docker compose -f deploy/docker-compose.yml up
# The audit DB lives in the named volume, so decisions survive restarts.
# ../data is bind-mounted so dashboard edits (PUT /v1/admin/data) persist on the
# host; the container runs as uid 65532, so make it writable first:
#   sudo chown -R 65532:65532 data/   (or: chmod -R a+rwX data/ for local dev)
services:
  cerberus:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8089:8089"
    environment:
      CERBERUS_ADDR: ":8089"
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:?set CERBERUS_ADMIN_TOKEN}
      CERBERUS_LOG_LEVEL: info
    volumes:
      - ../data:/data
      - cerberus-db:/var/lib/cerberus

  # Owl dashboard — optional at runtime (engine works without it):
  #   CERBERUS_ADMIN_TOKEN=smoke docker compose -f deploy/docker-compose.yml --profile owl up
  owl:
    profiles: [owl]
    build:
      context: ../owl
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      CERBERUS_URL: http://cerberus:8089
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:?set CERBERUS_ADMIN_TOKEN}
      # Read-only Rego sources for the /policy viewer; engine and Owl share
      # the policies files in compose (deploy decision in ROADMAP Phase 2).
      OWL_POLICY_DIR: /policies
    volumes:
      - ../policies:/policies:ro
    depends_on:
      - cerberus

volumes:
  cerberus-db:
